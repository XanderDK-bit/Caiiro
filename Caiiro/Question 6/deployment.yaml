apiVersion: apps/v1
kind: Deployment
metadata:
  name: caiiro-deployment
  labels:
    app: caiiro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caiiro
  template:
    metadata:
      labels:
        app: caiiro
    spec:
      containers:
        - name: caiiro
          image: caiiro-live:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi